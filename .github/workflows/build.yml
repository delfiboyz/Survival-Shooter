name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - WebGL
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license
        id: license
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::Secret UNITY_LICENSE belum diatur, build dilewati. Lihat README bagian CI."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        if: steps.license.outputs.available == 'true'
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      - uses: actions/upload-artifact@v4
        if: steps.license.outputs.available == 'true'
        with:
          name: SurvivalShooter-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
